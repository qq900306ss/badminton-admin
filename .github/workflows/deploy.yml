name: Deploy Admin to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 同時只跑一個部署:連續 merge 兩個 PR 時,以前兩次部署會同時跑,
# 先開始的那次最後才寫入 index.html,把新版首頁蓋回舊版。現在後來的排隊等前一個跑完。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_BOOKING_URL: ${{ secrets.VITE_BOOKING_URL }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Upload to S3 and invalidate CloudFront
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
        run: |
          # 檔名帶 hash 的 JS/CSS:內容永遠不變 → 快取一年,瀏覽器/CDN 不用再回來問。
          # 不加 --delete:還開著舊版頁面的人,稍後載入的舊 chunk 還拿得到(不會白畫面)
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets/" --cache-control "public,max-age=31536000,immutable"
          # 其他(index.html、sw.js、version.json、manifest、圖示):每次都回來確認,沒變就 304,新版才看得到
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --exclude "assets/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"
